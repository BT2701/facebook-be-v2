services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-service
        PORT: "8080"
    expose:
      - "8080"
    env_file:
      - ./user-service/.env
    environment:
      PORT: "8080"
      MONGO_URI: mongodb://mongodb:27017
      REDIS_URI: redis:6379
      DB_NAME: userdb
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-change-me}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
        PORT: "8081"
    expose:
      - "8081"
    env_file:
      - ./notification-service/.env
    environment:
      PORT: "8081"
      MONGO_URI: mongodb://mongodb:27017
      REDIS_URI: redis:6379
      DB_NAME: notificationdb
      JWT_SECRET: ${JWT_SECRET:-change-me}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: chat-service
        PORT: "8082"
    expose:
      - "8082"
    env_file:
      - ./chat-service/.env
    environment:
      PORT: "8082"
      MONGO_URI: mongodb://mongodb:27017
      REDIS_URI: redis:6379
      DB_NAME: chatdb
      JWT_SECRET: ${JWT_SECRET:-change-me}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  media-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: media-service
        PORT: "8083"
    expose:
      - "8083"
    env_file:
      - ./media-service/.env
    environment:
      PORT: "8083"
      MONGO_URI: mongodb://mongodb:27017
      REDIS_URI: redis:6379
      DB_NAME: mediadb
      JWT_SECRET: ${JWT_SECRET:-change-me}
    volumes:
      - media_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  post-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: post-service
        PORT: "8084"
    expose:
      - "8084"
    env_file:
      - ./post-service/.env
    environment:
      PORT: "8084"
      MONGO_URI: mongodb://mongodb:27017
      REDIS_URI: redis:6379
      DB_NAME: postdb
      JWT_SECRET: ${JWT_SECRET:-change-me}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  friend-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: friend-service
        PORT: "8085"
    expose:
      - "8085"
    env_file:
      - ./friend-service/.env
    environment:
      PORT: "8085"
      MONGO_URI: mongodb://mongodb:27017
      REDIS_URI: redis:6379
      DB_NAME: frienddb
      USER_SERVICE_URL: http://user-service:8080
      JWT_SECRET: ${JWT_SECRET:-change-me}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  game-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: game-service
        PORT: "8086"
    expose:
      - "8086"
    env_file:
      - ./game-service/.env
    environment:
      PORT: "8086"
      MONGO_URI: mongodb://mongodb:27017
      REDIS_URI: redis:6379
      DB_NAME: gamedb
      DEFAULT_GAME: slot
      JWT_SECRET: ${JWT_SECRET:-change-me}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  kong:
    image: kong:3.8
    container_name: kong
    depends_on:
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      post-service:
        condition: service_healthy
      friend-service:
        condition: service_healthy
      game-service:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /app/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
    volumes:
      - ./api-gateway/kong.yml:/app/kong.yml:ro
      - ./api-gateway/kong.conf:/etc/kong/kong.conf:ro

volumes:
  mongodb_data:
  media_uploads:
