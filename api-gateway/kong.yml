_format_version: "3.0"
services:
  - name: user-service
    url: http://user-service:8080
    routes:
      - name: user-route
        paths:
          - /user

  - name: notification-service
    url: http://notification-service:8081
    routes:
      - name: notification-route
        paths:
          - /notification

  - name: chat-service
    url: http://chat-service:8082
    routes:
      - name: chat-route
        paths:
          - /chat
      - name: message-route
        paths:
          - /message

  - name: media-service
    url: http://media-service:8083
    routes:
      - name: media-route
        paths:
          - /media

  - name: post-service
    url: http://post-service:8084
    routes:
      - name: post-route
        paths:
          - /post
      - name: comment-route
        paths:
          - /comment
      - name: reaction-route
        paths:
          - /reaction

  - name: friend-service
    url: http://friend-service:8085
    routes:
      - name: friend-route
        paths:
          - /friend
      - name: request-route
        paths:
          - /Request
          - /requests

  - name: game-service
    url: http://game-service:8086
    routes:
      - name: game-route
        paths:
          - /game

  - name: ai-service
    url: http://ai-service:8087
    routes:
      - name: ai-route
        paths:
          - /ai

plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
      methods:
        - GET
        - HEAD
        - PUT
        - PATCH
        - POST
        - DELETE
      headers:
        - Content-Type
        - Authorization
      credentials: true
      max_age: 3600
  - name: rate-limiting
    config:
      minute: 120
      policy: local
      fault_tolerant: true
      hide_client_headers: false
  - name: request-size-limiting
    config:
      allowed_payload_size: 20
